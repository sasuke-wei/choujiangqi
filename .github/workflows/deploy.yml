name: 部署抽奖台

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 构建
        run: |
          npm ci
          npm run build

      - name: 初始化数据库并发布
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'dist/server/wrangler.json';
          const config = JSON.parse(readFileSync(file, 'utf8'));
          const db = config.d1_databases.find(item => item.binding === 'DB');
          if (!process.env.D1_DATABASE_ID) throw new Error('缺少 D1_DATABASE_ID');
          config.name = 'choujiangqi';
          config.workers_dev = true;
          Object.assign(db, {
            database_name: 'choujiangqi-db',
            database_id: process.env.D1_DATABASE_ID,
            migrations_dir: '../../drizzle',
          });
          writeFileSync(file, JSON.stringify(config, null, 2));
          NODE

          npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
          npx wrangler deploy --config dist/server/wrangler.json
